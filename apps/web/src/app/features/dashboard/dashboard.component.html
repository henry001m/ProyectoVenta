<section class="ki-page"><div class="flex justify-content-between align-items-center mb-4"><div><h1>Resumen de mercado</h1><p>Oferta, demanda y señales de venta observadas.</p></div><p-button label="Nueva observación" icon="pi pi-plus" routerLink="/observations/new"></p-button></div><p *ngIf="loading">Cargando métricas...</p><p-message *ngIf="error" severity="error" [text]="error"></p-message><div class="grid" *ngIf="summary as data"><div class="col-12 md:col-3"><p-card header="Observaciones"><strong>{{ data.observations }}</strong></p-card></div><div class="col-12 md:col-3"><p-card header="Analizadas"><strong>{{ data.analyzed }}</strong></p-card></div><div class="col-12 md:col-3"><p-card header="Demanda"><strong>{{ data.demand_signals }}</strong></p-card></div><div class="col-12 md:col-3"><p-card header="Ventas detectadas"><strong>{{ data.sale_signals }}</strong></p-card></div><div class="col-12 md:col-6"><p-card header="Marcas más observadas"><ul><li *ngFor="let item of data.top_models">{{ item.model }} — {{ item.count }}</li></ul></p-card></div></div></section>
