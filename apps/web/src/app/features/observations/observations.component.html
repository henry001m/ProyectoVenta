<section class="ki-page"><h1>Observaciones</h1><div class="ki-card mb-4"><h2>Importar publicación</h2><input pInputText class="w-full mb-2" [(ngModel)]="sourceUrl" placeholder="URL de TikTok, Marketplace o fuente"><textarea pInputTextarea class="w-full mb-2" [(ngModel)]="rawText" rows="4" placeholder="Pega el texto, mensaje o descripción..."></textarea><p-button label="Guardar observación" icon="pi pi-save" [loading]="loading" (onClick)="create()"></p-button></div><p-message *ngIf="error" severity="error" [text]="error"></p-message><p-table [value]="items" responsiveLayout="scroll"><ng-template pTemplate="header"><tr><th>Contenido</th><th>Producto</th><th>Precio</th><th>Estado</th><th></th></tr></ng-template><ng-template pTemplate="body" let-item><tr><td>{{ item.raw_text | slice:0:80 }}</td><td>{{ item.brand || 'Pendiente' }} {{ item.model_name || '' }} {{ item.size || '' }}</td><td>{{ item.price || '—' }}</td><td>{{ item.status }}</td><td><p-button label="Analizar" size="small" [disabled]="item.status === 'analyzed'" (onClick)="analyze(item)"></p-button></td></tr></ng-template></p-table></section>
